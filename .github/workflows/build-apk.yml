name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Find and unzip battery version
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "NextClassChip_source_battery*.zip" | head -n 1)

          echo "Using ZIP: $ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "Battery source ZIP not found!"
            exit 1
          fi

          unzip -o "$ZIP_FILE"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: NextClassChip
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp NextClassChip/app/build/outputs/apk/debug/app-debug.apk NextClassChip-battery.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NextClassChip-Battery-APK
          path: NextClassChip-battery.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "battery-build-${GITHUB_RUN_NUMBER}" \
            NextClassChip-battery.apk \
            --target "${GITHUB_SHA}" \
            --title "NextClassChip Battery v1.2" \
            --notes "배터리 최적화 버전"
